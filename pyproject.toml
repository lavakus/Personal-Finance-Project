[project]
name = "swingscan"
version = "0.1.0"
description = "Indian equity swing-trade selection and trade-plan engine (scan -> filter -> rank -> plan; no order execution)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.50",
    "requests>=2.31",
    "pyyaml>=6.0",
    "pyarrow>=16",
]

[project.scripts]
swingscan = "swingscan.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swingscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
